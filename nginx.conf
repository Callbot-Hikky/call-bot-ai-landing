server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx ne compresse RIEN par défaut : sans ce bloc les visiteurs
    # reçoivent ~96 Ko de HTML brut (≈10 Ko une fois compressé).
    # text/html n'est pas listé : le module le compresse toujours.
    # Les .woff2 sont déjà compressés — les réencoder les alourdit.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Astro statique : fichiers réels (index.html, en/index.html, assets…).
    # On tente l'URL, puis le répertoire (clean URLs), sinon la 404 d'Astro.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;

    # Cache long pour les assets fingerprintés d'Astro.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

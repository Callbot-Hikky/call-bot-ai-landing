server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro statique : fichiers réels (index.html, en/index.html, assets…).
    # On tente l'URL, puis le répertoire (clean URLs), sinon la 404 d'Astro.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;

    # Cache long pour les assets fingerprintés d'Astro.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
